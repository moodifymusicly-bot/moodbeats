# One compose file, two deploy targets: laptop today, Debian VPS tomorrow.
# All secrets come from `.env` (copy from `.env.example`). Never commit `.env`.

services:
  db:
    image: postgres:15-alpine
    container_name: moodbeatz-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moodmusic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moodmusic_secret}
      POSTGRES_DB: ${POSTGRES_DB:-moodmusic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-moodmusic}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moodbeatz-redis
    # Cache workload: AOF on for cheap durability, RDB disabled, LRU eviction
    # when we hit the memory ceiling, require password. No published port -
    # backend reaches redis on the compose network only.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-change-me-redis-password} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodbeatz-backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-moodmusic}:${POSTGRES_PASSWORD:-moodmusic_secret}@db:5432/${POSTGRES_DB:-moodmusic}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis-password}@redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      # Clerk + YouTube come through env_file; listed here for visibility.
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=2).status==200 else 1)\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Vite bakes VITE_* vars into the bundle at build time from frontend/.env.production.
      # No build args needed here — values come from the file already committed to the repo.
    container_name: moodbeatz-frontend
    ports:
      - "3000:3000"
    # nginx serves static files — no runtime env vars required.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3000 > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Recommendation Service (standalone, port 8002)
  # Build context must be the project root so the Dockerfile can COPY both
  # backend/ (ORM models) and recommendation_system/ into the image.
  # ---------------------------------------------------------------------------
  recommendation-service:
    build:
      context: .
      dockerfile: recommendation_system/Dockerfile
    container_name: moodbeatz-recommendation
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-moodmusic}:${POSTGRES_PASSWORD:-moodmusic_secret}@db:5432/${POSTGRES_DB:-moodmusic}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis-password}@redis:6379/0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8001}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      # Auth — same Clerk tenant as the main backend
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      # YouTube quota (shared daily limit; workers track via Redis)
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # FAISS ANN index — persisted to a Docker volume so the index survives
      # container restarts without a full rebuild on every startup.
      FAISS_ENABLED: ${FAISS_ENABLED:-true}
      FAISS_INDEX_PATH: /var/moodbeatz/faiss/songs
      FAISS_MIN_CATALOG_SIZE: ${FAISS_MIN_CATALOG_SIZE:-50}
    volumes:
      - faissdata:/var/moodbeatz/faiss
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8002/api/health',timeout=2).status==200 else 1)\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  # FAISS index — persisted across recommendation-service restarts.
  # Rebuild happens automatically when index is stale (>10% behind DB count).
  faissdata:
