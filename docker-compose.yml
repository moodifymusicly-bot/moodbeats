version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: moodmusic-db
    environment:
      POSTGRES_USER: moodmusic
      POSTGRES_PASSWORD: moodmusic_secret
      POSTGRES_DB: moodmusic
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodmusic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: moodmusic-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodmusic-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://moodmusic:moodmusic_secret@db:5432/moodmusic
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-change-in-production
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
