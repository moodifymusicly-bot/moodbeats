version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: moodbeats-db
    environment:
      POSTGRES_USER: moodmusic
      POSTGRES_PASSWORD: moodmusic_secret
      POSTGRES_DB: moodmusic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodmusic"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moodbeats-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodbeats-backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://moodmusic:moodmusic_secret@db:5432/moodmusic
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: 39c5c7a6d62b690ecb7377aa40b1e1f6527b5ed2e64b390800267b7d7edf819f
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://moodbeats.187-77-184-168.nip.io
    container_name: moodbeats-frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
