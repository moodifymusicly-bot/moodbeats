services:
  - type: web
    name: moodbeats-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: MoodBeats API
      - key: ALLOWED_ORIGINS
        value: https://moodbeats.vercel.app,http://localhost:3000
      - key: PORT
        value: 8000
